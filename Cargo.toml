[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Sergey Vilgelm <sergey@vilgelm.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sv-tools/template-rs"
keywords = ["template"]
categories = ["development-tools"]

# Declare shared third-party dependencies here once, and reference them from
# the crates with `<name>.workspace = true` so their versions stay in lockstep.
[workspace.dependencies]

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
