name: Publish

on:
  push:
    tags: [ "**/v[0-9]+.[0-9]+.[0-9]+" ]

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  Checks:
    uses: ./.github/workflows/checks.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Publish:
    needs: Checks
    strategy:
      matrix:
        package: ${{ fromJSON(needs.Checks.outputs.publish) }}
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --all-features --package ${{ matrix.package }} --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
